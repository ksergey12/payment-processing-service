spring:
  application:
    name: payment-processing-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
  threads:
    virtual:
      enabled: false
  profiles:
    active: local

server:
  port: 8080

jwt:
  secret: "VGhpc0lzQVRlc3RTZWNyZXRLZXlGb3JKV1RTaWduaW5nMjAyNg=="
  expiration-ms: 3600000

resilience4j:
  retry:
    instances:
      bankGateway:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - com.saas.paymentservice.external.BankGatewayException
  circuitbreaker:
    instances:
      bankGateway:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - com.saas.paymentservice.external.BankGatewayException

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
